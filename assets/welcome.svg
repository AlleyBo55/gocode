      <stop offset="0" stop-color="#0d1326"/>
      <stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="844" height="414" rx="14" fill="url(#bg)" stroke="#1b2a4a" stroke-width="1.5"/>
  <rect x="8" y="8" width="844" height="38" rx="14" fill="#101832"/>
  <rect x="8" y="30" width="844" height="16" fill="#101832"/>
  <circle cx="30" cy="27" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="27" r="6" fill="#ffbd2e"/>
  <circle cx="70" cy="27" r="6" fill="#27c93f"/>
  <text x="430" y="31" text-anchor="middle" font-size="13" fill="#6b7aa0">gocode</text>

  <!-- gopher -->
  <g font-size="20" font-weight="bold">
    <text x="40" y="100" fill="#00ADD8">&#x256D;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x2500;&#x256E;</text>
    <text x="40" y="126" fill="#00ADD8">&#x2502; <tspan fill="#ffffff">&#x25CF;&#160;&#160;&#x25CF;</tspan> &#x2502;</text>
    <text x="40" y="152" fill="#00ADD8">&#x2502;&#160;&#160;<tspan fill="#00A29C">&#x25E1;</tspan>&#160;&#160;&#160;&#x2502;</text>
    <text x="40" y="178" fill="#00ADD8">&#x2570;&#x2500;<tspan fill="#00A29C">&#x2282;&#x25AC;&#x25AC;&#x2283;</tspan>&#x2500;&#x256F;</text>
  </g>

  <!-- wordmark + taglines -->
  <g>
    <text x="210" y="118" font-size="30" font-weight="bold">
      <tspan fill="#00ADD8">g</tspan><tspan fill="#00A29C">o</tspan><tspan fill="#00ADD8">c</tspan><tspan fill="#00A29C">o</tspan><tspan fill="#00ADD8">d</tspan><tspan fill="#00A29C">e</tspan>
