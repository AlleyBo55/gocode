version: 2

project_name: gocode

builds:
  - main: ./cmd/gocode
    binary: gocode
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

nfpms:
  - id: gocode
    package_name: gocode
    vendor: AlleyBo55
    homepage: https://github.com/AlleyBo55/gocode
    maintainer: AlleyBo55
    description: High-performance AI agent harness runtime in Go
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin

checksum:
  name_template: "checksums.txt"

release:
  header: |
    Install:

        go install github.com/AlleyBo55/gocode/cmd/gocode@latest

    or download a binary below. Full notes for this release are in
    [CHANGELOG.md](https://github.com/AlleyBo55/gocode/blob/master/CHANGELOG.md).

    Start with no API key at all: install [Ollama](https://ollama.com),
    `ollama pull qwen2.5-coder:7b`, then run `gocode`.

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

